# GodView Nginx 反代配置（阿里云轻量 / ECS 通用）
# 用法：
#   sudo cp deploy/nginx-godview.conf /etc/nginx/conf.d/godview.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 关键点：必须关掉 /api/chat/stream 的响应缓冲，否则访谈和报告的"流式打字效果"
#         会被 Nginx 攒着一起吐出来，看起来就像卡住半天才出字。

upstream godview {
    server 127.0.0.1:8080;      # docker compose 映射到宿主的端口
    keepalive 32;
}

server {
    listen 80;
    server_name _;              # 有域名就填域名，临时用公网 IP 也可

    client_max_body_size 8m;    # 与后端 express.json({limit:'8mb'}) 对齐

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 接口（含 SSE 流式） ----------
    location /api/ {
        proxy_pass http://godview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 三件套：不缓冲、不缓存、长连接不超时
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection '';
    }

    # ---------- 前端 SPA ----------
    location / {
        proxy_pass http://godview;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
