<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>GodView 参赛封面</title>
<style>
  :root{
    --primary:#0EA5E9; --bright:#38BDF8; --light:#7DD3FC;
    --ink:#0369A1; --deep:#075985;
    --bg0:#050A12; --bg1:#0B2135; --line:rgba(56,189,248,.18);
    --mono:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
    --sans:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0f18;display:flex;align-items:center;justify-content:center;
       min-height:100vh;font-family:var(--sans);padding:24px}

  .cover{
    position:relative;width:1600px;height:900px;overflow:hidden;border-radius:20px;
    background:
      radial-gradient(1200px 700px at 78% 28%, rgba(14,165,233,.22), transparent 60%),
      radial-gradient(900px 600px at 12% 88%, rgba(56,189,248,.12), transparent 62%),
      linear-gradient(155deg, var(--bg0) 0%, var(--bg1) 55%, #071a2b 100%);
    box-shadow:0 40px 120px rgba(0,0,0,.6);
  }
  /* 点阵 */
  .cover::before{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(125,211,252,.16) 1px, transparent 1px);
    background-size:26px 26px;opacity:.5;
    mask-image:radial-gradient(circle at 60% 50%, #000 30%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 60% 50%, #000 30%, transparent 78%);
  }
  /* 斜切光带 */
  .cover::after{
    content:"";position:absolute;right:-160px;top:-200px;width:760px;height:1100px;
    background:linear-gradient(115deg, rgba(14,165,233,.16), rgba(56,189,248,.04) 55%, transparent);
    transform:rotate(14deg);
  }

  .inner{position:relative;z-index:2;height:100%;display:flex;align-items:center;
         padding:0 96px;gap:80px}

  /* ---------- 左：标题区 ---------- */
  .left{flex:1.05;max-width:820px}
  .tagline{font-family:var(--mono);font-size:17px;letter-spacing:5px;
           color:var(--bright);text-transform:uppercase;margin-bottom:26px}
  .tagline b{color:#fff;font-weight:700}

  h1{
    font-size:132px;line-height:1.02;font-weight:900;letter-spacing:6px;
    background:linear-gradient(100deg,#E8F7FF 0%, var(--light) 42%, var(--primary) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 70px rgba(14,165,233,.28);
  }
  .h1-en{font-family:var(--mono);font-size:22px;letter-spacing:8px;color:rgba(125,211,252,.72);
         margin-top:14px}

  .sub{margin-top:34px;font-size:40px;font-weight:300;color:#DCEEFB;line-height:1.4}
  .sub em{font-style:normal;font-weight:800;color:var(--bright);
          border-bottom:3px solid rgba(56,189,248,.5);padding-bottom:4px}

  .divider{width:96px;height:4px;border-radius:2px;margin:40px 0 32px;
           background:linear-gradient(90deg,var(--primary),transparent)}

  .slogan{font-size:27px;color:rgba(226,242,255,.82);letter-spacing:2px;line-height:1.6}

  .chips{display:flex;gap:14px;margin-top:44px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:14px;letter-spacing:1.5px;
        color:var(--light);border:1px solid var(--line);border-radius:999px;
        padding:10px 20px;background:rgba(14,165,233,.08)}
  .chip.hot{color:#04121F;background:linear-gradient(100deg,var(--light),var(--primary));
            border-color:transparent;font-weight:700}

  /* ---------- 右：图谱视觉 ---------- */
  .right{flex:1;display:flex;align-items:center;justify-content:center}
  .viz{width:520px;height:560px;position:relative}
  .viz svg{width:100%;height:100%;overflow:visible}
  .pulse{animation:pulse 3.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .spin{transform-origin:260px 280px;animation:spin 46s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 底部信息条 ---------- */
  .footer{position:absolute;left:96px;right:96px;bottom:52px;z-index:3;
          display:flex;align-items:center;justify-content:space-between;
          padding-top:26px;border-top:1px solid rgba(56,189,248,.16)}
  .team{font-size:19px;color:rgba(226,242,255,.9);letter-spacing:1px}
  .team span{color:var(--bright);font-weight:700}
  .brand{display:flex;align-items:center;gap:16px;font-family:var(--mono);
         font-size:14px;letter-spacing:3px;color:rgba(125,211,252,.8)}
  .brand b{color:#fff;font-weight:700;letter-spacing:1px;font-size:17px}

  .track{position:absolute;right:96px;top:56px;z-index:3;
         font-family:var(--mono);font-size:14px;letter-spacing:2px;
         color:#04121F;background:linear-gradient(100deg,var(--light),var(--primary));
         padding:11px 22px;border-radius:999px;font-weight:700}
</style>
</head>
<body>
<div class="cover">

  <div class="track">价值突破赛道 · AI + 零售智能决策</div>

  <div class="inner">
    <!-- 左 -->
    <div class="left">
      <div class="tagline">GodView · <b>DECISION SIMULATION CONSOLE</b></div>
      <h1>先演后干</h1>
      <div class="h1-en">MULTI-AGENT RETAIL SIMULATION</div>
      <div class="sub">给零售一台 <em>「如果」</em> 机器</div>
      <div class="divider"></div>
      <div class="slogan">输入一条经营假设，长出一个会演化、<br/>能访谈、可审计的门店世界</div>
      <div class="chips">
        <div class="chip hot">多智能体涌现</div>
        <div class="chip">节点可访谈</div>
        <div class="chip">因果链可追溯</div>
        <div class="chip">一键决策报告</div>
      </div>
    </div>

    <!-- 右：世界图谱 -->
    <div class="right">
      <div class="viz">
        <svg viewBox="0 0 520 560" fill="none" stroke="#38BDF8" stroke-width="1.2">
          <g class="spin" stroke="rgba(56,189,248,.35)">
            <ellipse cx="260" cy="280" rx="215" ry="215"/>
            <ellipse cx="260" cy="280" rx="150" ry="150"/>
            <ellipse cx="260" cy="280" rx="85" ry="85"/>
          </g>
          <!-- 连线 -->
          <g stroke="rgba(56,189,248,.42)">
            <line x1="260" y1="280" x2="118" y2="132"/>
            <line x1="260" y1="280" x2="404" y2="118"/>
            <line x1="260" y1="280" x2="442" y2="268"/>
            <line x1="260" y1="280" x2="386" y2="418"/>
            <line x1="260" y1="280" x2="150" y2="404"/>
            <line x1="260" y1="280" x2="72"  y2="282"/>
            <line x1="118" y1="132" x2="404" y2="118"/>
            <line x1="404" y1="118" x2="442" y2="268"/>
            <line x1="150" y1="404" x2="386" y2="418"/>
            <line x1="118" y1="132" x2="150" y2="404"/>
            <line x1="72"  y1="282" x2="386" y2="418"/>
          </g>
          <!-- 卫星节点 -->
          <g>
            <circle cx="118" cy="132" r="15" fill="#0B2135"/><circle cx="118" cy="132" r="6" fill="#38BDF8"/>
            <circle cx="404" cy="118" r="17" fill="#0B2135"/><circle cx="404" cy="118" r="7" fill="#38BDF8"/>
            <circle cx="442" cy="268" r="13" fill="#0B2135"/><circle cx="442" cy="268" r="5.5" fill="#7DD3FC"/>
            <circle cx="386" cy="418" r="16" fill="#0B2135"/><circle cx="386" cy="418" r="6.5" fill="#38BDF8"/>
            <circle cx="150" cy="404" r="14" fill="#0B2135"/><circle cx="150" cy="404" r="6" fill="#7DD3FC"/>
            <circle cx="72"  cy="282" r="12" fill="#0B2135"/><circle cx="72"  cy="282" r="5" fill="#38BDF8"/>
          </g>
          <!-- 卫星文字 -->
          <g font-family="PingFang SC, sans-serif" font-size="17" fill="rgba(226,242,255,.85)" stroke="none">
            <text x="118" y="112" text-anchor="middle">顾客分群</text>
            <text x="404" y="98"  text-anchor="middle">竞争对手</text>
            <text x="452" y="290" >供应商</text>
            <text x="386" y="448" text-anchor="middle">门店员工</text>
            <text x="150" y="434" text-anchor="middle">外卖平台</text>
            <text x="66"  y="312" text-anchor="middle">KPI</text>
          </g>
          <!-- 中心 -->
          <g class="pulse"><circle cx="260" cy="280" r="46" fill="rgba(14,165,233,.16)"/></g>
          <circle cx="260" cy="280" r="34" fill="#0B2135" stroke="#38BDF8" stroke-width="2"/>
          <circle cx="260" cy="280" r="13" fill="#38BDF8"/>
          <text x="260" y="342" text-anchor="middle" font-family="PingFang SC, sans-serif"
                font-size="21" fill="#fff" stroke="none" font-weight="700">门店生态</text>
          <text x="260" y="366" text-anchor="middle" font-family="JetBrains Mono, monospace"
                font-size="13" fill="rgba(125,211,252,.75)" stroke="none">14 ENTITIES · 15 EDGES</text>
          <!-- 光点 -->
          <g fill="#7DD3FC" stroke="none">
            <circle class="pulse" cx="200" cy="180" r="2.6"/>
            <circle class="pulse" cx="330" cy="200" r="2.2" style="animation-delay:.8s"/>
            <circle class="pulse" cx="330" cy="360" r="2.4" style="animation-delay:1.6s"/>
            <circle class="pulse" cx="196" cy="368" r="2.2" style="animation-delay:2.4s"/>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="team">团队：<span>廉晨涛</span> · <span>徐亚敏</span> · <span>方瑞</span>　|　营销履约 × 原子智能 × 零售云 POS</div>
    <div class="brand"><b>多点 Dmall</b>　DECISION SIMULATION CONSOLE</div>
  </div>
</div>
</body>
</html>
